name: desktop-scriptures
title: Desktop Scriptures
summary: Offline LDS scripture reader with notes, tags, search, sync, and opt-in AI
description: |
  A desktop reader for the Bible, Book of Mormon, Doctrine and Covenants,
  Pearl of Great Price, Journal of Discourses, Lectures on Faith, the
  Joseph Smith Translation, and the KJV Apocrypha, plus 1 Enoch and the
  Book of Jasher (labeled not scripture). The core reading and study experience works
  fully offline - personal notes, tags, verse highlighting, keyword
  search, a Topical Guide, General Conference and Ensign/Liahona citations,
  a Cross-references tab pointing out known parallel passages elsewhere in
  the corpus alongside any you add yourself, a Word Study tab with the
  Hebrew and Greek words behind the English, what every Book of Mormon name
  may mean, and Book of Mormon dates in Israel's calendar (names and dates
  are links in the text), a Scripture of the Day banner,
  a reading streak, a Resume
  Reading history of your last 5 chapters, a Journal with one searchable
  entry per day (optionally
  linked to a verse or chapter you're reflecting on), a choice of accent
  colors, cloud-folder sync across your own devices (via whatever cloud
  client - Nextcloud, OneDrive, Google Drive, or similar - already keeps
  a folder synced on your machine, so the app itself never talks to the
  network for this), an opt-in Temple Recommend renewal reminder (also
  fully offline - it just checks the expiration date you enter against
  today's date), an opt-in Family History reminder that nudges you at
  random intervals so it stays noticeable, and Listen controls to have any
  chapter read aloud - verse by verse, with the current verse
  highlighted - in a choice of four voices (American or British English,
  male or female), each downloaded once on request.

  A handful of landing-page extras are opt-in and off by default, only
  reaching the network once you turn them on: AI-assisted search (ask a
  question in your own words - and refine it conversationally with
  follow-ups - to get pointed at real, matching scripture, using your own
  AI endpoint, plus an optional study index built through that same
  endpoint so AI features can find passages by meaning, with a setup
  wizard), a Church News headline, a Come Follow Me helper showing
  this week's lesson, and an Inspirational Message featuring whatever's
  currently on churchofjesuschrist.org's own homepage. A General
  Conference reminder (also opt-in) shows once a day in the two weeks
  before Conference. New Conference talks and Liahona articles arrive on
  their own from this project's GitHub, weekly (switch off under View).

  This is an unofficial application, not produced by or affiliated with
  The Church of Jesus Christ of Latter-day Saints, or with Community of
  Christ. Scripture text courtesy of the beandog/lds-scriptures project;
  Journal of Discourses and JST text from public-domain scans on
  archive.org; the KJV Apocrypha from CrossWire and eBible.org; 1 Enoch
  and Jasher from Project Gutenberg and Wikisource; General Conference
  citation data from BYU's Scripture Citation Index; Ensign/Liahona
  citations detected from each article's own scripture links on
  churchofjesuschrist.org. The Topical Guide is Desktop Scriptures' own
  correlation of its local scripture text and that same citation index -
  not a copy of the Church's own, separately-copyrighted Topical Guide.
  Cross-references are hand-curated the same way: an accuracy-first list
  of 610 well-documented parallel passages - quotations, paraphrases,
  JST/Moses-style revisions, and typology scripture itself explicitly
  states, plus a smaller, distinctly-labeled "traditionally linked to"
  tier for associations scripture doesn't explicitly state - each
  verified against this app's own text and tagged with the Topical Guide
  topic it's actually teaching.

  Lexicons: Strong's dictionaries from Open Scriptures (CC BY-SA) and STEP
  Bible meanings (Tyndale House; CC BY 4.0). Book of Mormon name meanings
  are this project's own summaries, linked to BYU's Book of Mormon
  Onomasticon. Text-to-speech: Piper (GPL-3.0). The About menu has full
  credits and licenses; Help links to the user guide (the wiki).

adopt-info: desktop-scriptures
license: GPL-3.0-or-later
contact: https://github.com/kz6fittycent/Desktop-Scriptures
issues: https://github.com/kz6fittycent/Desktop-Scriptures/issues
source-code: https://github.com/kz6fittycent/Desktop-Scriptures
icon: snap/gui/desktop-scriptures.png
website: https://github.com/kz6fittycent/Desktop-Scriptures
donation: https://www.patreon.com/kz6fittycent

base: core24
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  desktop-scriptures:
    command: src/scriptures/ui/app.py
    extensions:
      - gnome
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - home
      # For this app's several opt-in, off-by-default network features -
      # AI-assisted search (see ai_client.py, talks only to whatever
      # endpoint the user configures under AI Integration -> AI
      # Settings...), the landing page's Church News, Come Follow Me,
      # and Inspirational Message boxes (see church_news.py, cfm.py, and
      # inspiration.py), and the General Conference reminder popup (see
      # general_conference.py) - each fetches from a single fixed Church
      # source only once turned on in the View menu. Never anywhere on
      # its own otherwise.
      - network
      # For the Listen (text-to-speech) controls in the reading view -
      # see tts_playback.py. Synthesis itself is fully offline (Piper
      # voices the user downloads once, into $SNAP_USER_COMMON/voices -
      # see tts.py; that one download uses the network plug above); this
      # plug is only for routing the resulting audio to the sound device.
      - audio-playback
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: $SNAP/lib/python3.12/site-packages:$SNAP/src

parts:
  desktop-scriptures:
    plugin: python
    source: .
    python-requirements:
      - requirements.txt
    stage-packages:
      - libsqlite3-0
      - fonts-noto-color-emoji
      - fonts-dejavu-core
    override-build: |
      craftctl default

      mkdir -p "$CRAFT_PART_INSTALL/src"
      cp -r "$CRAFT_PART_SRC/src/scriptures" "$CRAFT_PART_INSTALL/src/scriptures"
      find "$CRAFT_PART_INSTALL/src" -name "__pycache__" -type d -exec rm -rf {} +
      chmod +x "$CRAFT_PART_INSTALL/src/scriptures/ui/app.py"

      mkdir -p "$CRAFT_PART_INSTALL/data"
      cp "$CRAFT_PART_SRC/LICENSE" "$CRAFT_PART_INSTALL/LICENSE"
      cp "$CRAFT_PART_SRC/THIRD_PARTY_LICENSES.md" "$CRAFT_PART_INSTALL/THIRD_PARTY_LICENSES.md"
      cp "$CRAFT_PART_SRC/data/scriptures.db" "$CRAFT_PART_INSTALL/data/scriptures.db"
      cp "$CRAFT_PART_SRC/data/volumes.json" "$CRAFT_PART_INSTALL/data/volumes.json"
      cp "$CRAFT_PART_SRC/data/scripture_of_the_day_pool.json" "$CRAFT_PART_INSTALL/data/scripture_of_the_day_pool.json"
      cp "$CRAFT_PART_SRC/data/verse_citations.json" "$CRAFT_PART_INSTALL/data/verse_citations.json"
      cp "$CRAFT_PART_SRC/data/liahona_citations.json" "$CRAFT_PART_INSTALL/data/liahona_citations.json"

      craftctl set version="$(grep -oP '__version__ = "\K[^"]+' "$CRAFT_PART_SRC/src/scriptures/__init__.py")"
