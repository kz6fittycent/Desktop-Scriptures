name: 📖 Refresh GC Citations

# Automates *when* scripts/harvest_citations.py runs, not what it does -
# it's still the same developer-scoped, rate-limited, metadata-only
# harvest (never talk text), just on a schedule instead of by hand. It
# refreshes every verse already in data/verse_citations.json (the
# Scripture of the Day pool and the Topical Guide's verses - about 1,250,
# roughly 45 minutes) and merges, so no verse's citations are dropped.
# Weekly, so a Conference's talks reach the app within days of
# scriptures.byu.edu's index catching up. Each run publishes the result to
# the "citations-data" release, which the app downloads (content_updates.py)
# - no app update needed - and opens and merges a pull request so the next
# release bundles it too - unattended.
on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Mondays
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Start from the published data, if it's newer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The weekly publish (below) can run ahead of the repo while its
          # pull request waits to be merged - start from whichever is newer
          # so nothing published is ever dropped.
          if gh release download citations-data --pattern "verse_citations.json.gz" --dir /tmp/published 2>/dev/null; then
            gunzip -f /tmp/published/verse_citations.json.gz
            newer="$(python3 -c "import sys; sys.path.insert(0, 'src'); from scriptures.citation_files import harvested_date as h; from pathlib import Path; print(h(Path('/tmp/published/verse_citations.json')) > h(Path('data/verse_citations.json')))")"
            if [[ "$newer" == "True" ]]; then
              cp /tmp/published/verse_citations.json data/verse_citations.json
              echo "Starting from the published copy"
            fi
          fi
          cp data/verse_citations.json /tmp/baseline.json

      - name: Re-harvest citation metadata
        run: python3 scripts/harvest_citations.py

      - name: Check and publish for the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Refuses (and fails this run) if the harvest lost entries.
          python3 scripts/publish_citations.py verse_citations.json --baseline /tmp/baseline.json --out dist
          gh release view citations-data >/dev/null 2>&1 || gh release create citations-data \
            --prerelease --title "Citation data (updated weekly)" \
            --notes "General Conference and Liahona citation lists, refreshed weekly by the refresh-*-citations workflows and downloaded by the app (src/scriptures/content_updates.py). Not an app release." \
            || gh release view citations-data >/dev/null  # created meanwhile by the other refresh
          gh release upload citations-data dist/verse_citations.json.gz dist/verse_citations.json.gz.sha256 --clobber

      # Opens a PR only if the harvest actually produced a different
      # data/verse_citations.json (create-pull-request no-ops otherwise),
      # then merges it straight away - no one has to be around to do it.
      # The data has already passed publish_citations.py's checks above (a
      # harvest that lost entries fails the run before this). A merge made
      # with GITHUB_TOKEN doesn't start other workflows, so it doesn't
      # publish a snap candidate; the data ships with the next real release.
      - name: Open a PR if the citation data changed
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          # Only the citation file: the harvest doesn't touch anything
          # else, and nothing else should ride along.
          add-paths: data/verse_citations.json
          commit-message: "Refresh General Conference citation metadata"
          title: "Refresh General Conference citation metadata"
          body: |
            Automated re-harvest of `data/verse_citations.json` from
            scriptures.byu.edu's Citation Index (see
            `scripts/harvest_citations.py`) - metadata only (talk title,
            speaker, date, churchofjesuschrist.org URL), never talk text.

            Merged automatically by this workflow, so the next release bundles it. The app already has it: this run published it to the `citations-data` release, which the app checks daily.
          branch: automated/refresh-gc-citations
          delete-branch: true

      - name: Merge the PR
        if: steps.pr.outputs.pull-request-number && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --squash --delete-branch
