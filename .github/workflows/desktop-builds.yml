name: 🖥️ Windows & macOS Builds

# Builds the Windows installer and the macOS .dmg with PyInstaller
# (packaging/desktop-scriptures.spec), smoke-tests each packaged app, and
# captures screenshots of it. Both are unsigned; see packaging/README.md.
#
# Runs on:
# - a push to main: builds, then a call for testing - like the snap's
#   (call-for-testing.yml): the installers go on a public pre-release, so
#   testers without a GitHub account can download them, and an issue
#   (label: desktop-testing) gives the links, how to open an unsigned app,
#   what to try, and the screenshots. Only the 3 newest test pre-releases
#   are kept.
# - a version tag (v2.3.0): builds and publishes the real GitHub Release.
# - a push to the desktop-builds-test branch: the same as main (issue titled
#   "[test branch]"), for trying packaging changes without building the snap.
# - a manual run (Actions tab -> Run workflow): builds only; the files are
#   kept as workflow artifacts.

on:
  push:
    tags: [ "v*" ]
    branches: [ main, desktop-builds-test ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
          - os: macos-latest
            label: macOS Apple Silicon
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow

      - name: Read the version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/scriptures/__init__.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ $version"
            exit 1
          fi

      - name: Cache voices
        uses: actions/cache@v4
        with:
          path: data/tts_voices
          key: tts-voices-${{ hashFiles('scripts/download_tts_voices.py') }}

      - name: Download voices
        run: python scripts/download_tts_voices.py

      - name: Build with PyInstaller
        run: pyinstaller packaging/desktop-scriptures.spec --noconfirm

      # --- Windows ---------------------------------------------------------

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # A windowed (no console) program, so wait on it for its exit code.
          $p = Start-Process -FilePath "dist\Desktop Scriptures\Desktop Scriptures.exe" `
            -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path "$env:APPDATA\Desktop Scriptures\scriptures.db")) {
            throw "The user database wasn't created in %APPDATA%"
          }
          Write-Host "Smoke test passed"

      - name: Screenshots (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The real Windows look first; the offscreen renderer as a fallback.
          $exe = "dist\Desktop Scriptures\Desktop Scriptures.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--screenshots", "screenshots" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "::warning::Native screenshots failed (exit $($p.ExitCode)); using the offscreen renderer"
            $env:QT_QPA_PLATFORM = "offscreen"
            $p = Start-Process -FilePath $exe -ArgumentList "--screenshots", "screenshots" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Screenshots failed with exit code $($p.ExitCode)" }
          }
          Get-ChildItem screenshots

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('snap/gui/desktop-scriptures.png').save('packaging/windows/desktop-scriptures.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} "/DSourceDir=..\..\dist\Desktop Scriptures" packaging\windows\installer.iss

      - name: Test silent install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent install failed with exit code $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\Desktop Scriptures\Desktop Scriptures.exe"
          if (-not (Test-Path $exe)) { throw "Not installed where expected: $exe" }
          Write-Host "Installed to $exe"

      # --- macOS -----------------------------------------------------------

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "dist/Desktop Scriptures.app/Contents/MacOS/Desktop Scriptures" --smoke-test
          test -f "$HOME/Library/Application Support/Desktop Scriptures/scriptures.db"

      - name: Screenshots (macOS)
        if: runner.os == 'macOS'
        run: |
          # The real macOS look first; the offscreen renderer as a fallback.
          app="dist/Desktop Scriptures.app/Contents/MacOS/Desktop Scriptures"
          if ! "$app" --screenshots screenshots; then
            echo "::warning::Native screenshots failed; using the offscreen renderer"
            QT_QPA_PLATFORM=offscreen "$app" --screenshots screenshots
          fi
          ls screenshots

      - name: Build .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          # Unsigned, but Apple Silicon requires at least an ad-hoc signature.
          codesign --force --deep --sign - "dist/Desktop Scriptures.app"
          mkdir -p dmg
          cp -R "dist/Desktop Scriptures.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Desktop Scriptures" -srcfolder dmg -ov -format UDZO \
            "dist/Desktop-Scriptures-${{ steps.version.outputs.version }}-macos-arm64.dmg"

      # --- Both ------------------------------------------------------------

      - name: Checksum
        shell: bash
        run: |
          cd dist
          for f in *-setup.exe *.dmg; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256"
            cat "$f.sha256"
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: desktop-scriptures-${{ runner.os }}
          path: |
            dist/*-setup.exe
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ runner.os }}
          path: screenshots/*.png
          if-no-files-found: error

  call-for-testing:
    name: Call for testing
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/scriptures/__init__.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=test-v$version-build$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-scriptures-*
          path: builds
          merge-multiple: true

      - name: Download the screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: screenshots

      - name: Publish a test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" builds/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Test build: Desktop Scriptures $VERSION (build $GITHUB_RUN_NUMBER)" \
            --notes "A test build for Windows and macOS - not a release. See the linked call for testing issue."

          # Keep only the 3 newest test pre-releases (each is ~700 MB).
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("test-v"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r old; do
            echo "Removing old test pre-release $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done

      - name: Publish the screenshots to the screenshots branch
        id: shots
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -r screenshots /tmp/new-screenshots
          if git ls-remote --exit-code --heads origin screenshots >/dev/null 2>&1; then
            git fetch origin screenshots
            git checkout -B screenshots origin/screenshots
          else
            git checkout --orphan screenshots
            git rm -rf --quiet .
          fi
          dest="desktop/$TAG"
          mkdir -p "$dest"
          cp /tmp/new-screenshots/screenshots-Windows/*.png "$dest/" 2>/dev/null && \
            for f in "$dest"/[0-9]-*.png; do mv "$f" "$dest/windows-$(basename "$f")"; done
          cp /tmp/new-screenshots/screenshots-macOS/*.png "$dest/" 2>/dev/null && \
            for f in "$dest"/[0-9]-*.png; do mv "$f" "$dest/macos-$(basename "$f")"; done
          ls "$dest"
          git add "$dest"
          git commit -m "Add Windows and macOS screenshots for $TAG"
          for attempt in 1 2 3; do
            if git push origin screenshots; then break; fi
            if [[ "$attempt" == 3 ]]; then echo "::error::push failed after 3 attempts"; exit 1; fi
            sleep 10; git fetch origin screenshots; git rebase origin/screenshots
          done
          echo "dest=$dest" >> "$GITHUB_OUTPUT"

      - name: Open the call for testing issue
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DEST: ${{ steps.shots.outputs.dest }}
        run: |
          gh label create "desktop-testing" --repo "$GITHUB_REPOSITORY" --color "1D76DB" \
            --description "Windows/macOS test build ready for testing" 2>/dev/null || true

          release="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          download="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          shots="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/screenshots/$DEST"
          prefix=""
          [[ "$GITHUB_REF_NAME" != "main" ]] && prefix="[test branch] "

          body=$(cat <<EOF
          A new test build of Desktop Scriptures for **Windows** and **macOS** is ready. Thank you for helping test it!

          **Version:** $VERSION (build $GITHUB_RUN_NUMBER) · [all files and checksums]($release)

          ## Windows 11

          1. Download **[Desktop-Scriptures-$VERSION-windows-x64-setup.exe]($download/Desktop-Scriptures-$VERSION-windows-x64-setup.exe)** (about 325 MB).
          2. Open it. Windows will say **"Windows protected your PC"** because the app isn't code-signed yet: click **More info**, then **Run anyway**.
          3. Click through the installer (no administrator password needed). Desktop Scriptures appears in the Start menu.

          ## macOS (Apple Silicon - M1 or newer)

          1. Download **[Desktop-Scriptures-$VERSION-macos-arm64.dmg]($download/Desktop-Scriptures-$VERSION-macos-arm64.dmg)** (about 360 MB).
          2. Open it and drag **Desktop Scriptures** into **Applications**.
          3. The first time you open it, macOS will refuse because the app isn't code-signed yet. Open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** next to Desktop Scriptures. After that it opens normally.

          ## What to try

          - [ ] It opens, and the home page looks right
          - [ ] Open a chapter (e.g. the Book of Mormon → Helaman → 1) and read a little
          - [ ] Hover over a blue name in a Book of Mormon chapter, then click it - a card opens in the Word Study tab
          - [ ] Search for a word (the search box at the top right)
          - [ ] **Listen** (top of a chapter) reads it aloud
          - [ ] Add a note or a highlight, quit the app, reopen it - it's still there
          - [ ] Anything that looks wrong, or text that doesn't fit

          **Reporting:** comment on this issue (a free GitHub account is needed), or just tell James. A screenshot of anything odd helps a lot - please say which system you're on.

          ## Automated screenshots

          Taken on GitHub's build machines right after building, as a check that each build starts.

          **Windows**

          ![Windows home]($shots/windows-1-home.png)

          ![Windows - Helaman 1 with Word Study]($shots/windows-2-word-study.png)

          **macOS**

          ![macOS home]($shots/macos-1-home.png)

          ![macOS - Helaman 1 with Word Study]($shots/macos-2-word-study.png)

          ---
          _Opened automatically after a successful build on \`$GITHUB_REF_NAME\`. These test builds aren't a release - only the 3 newest are kept._
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --label "desktop-testing" \
            --title "${prefix}Call for testing: Windows & macOS v$VERSION (build $GITHUB_RUN_NUMBER)" \
            --body "$body"

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Desktop Scriptures ${GITHUB_REF_NAME#v}" \
            --notes "Windows and macOS builds - unsigned. See the wiki's Installation page for how to open them the first time. Linux: install the snap (snap install desktop-scriptures)."
