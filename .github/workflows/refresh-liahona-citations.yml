name: 📖 Refresh Liahona Citations

# Automates *when* scripts/harvest_liahona_citations.py runs, not what it
# does - same developer-scoped, rate-limited, metadata-only harvest
# (never article text) it's always been, just on a schedule. Weekly, so
# a new issue reaches the app within days of being posted: each run
# publishes to the "citations-data" release, which the app downloads
# (content_updates.py) without an app update, and opens a pull request
# so the next release bundles it too.
#
# Scans only the last 3 issues (the harvester's default - new articles
# only appear in new issues), so a run takes a few minutes.
# data/liahona_citations.json already carries the full 1971-present
# backfill; a complete rescan (--full) takes many hours and is run by
# hand. Scanning the whole archive here is what timed out before: about
# half of all articles cite no scripture, so they're never stored, and
# every full scan re-downloaded ~12,000 of them.
on:
  schedule:
    - cron: "0 7 * * 1"  # weekly, Mondays
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Start from the published data, if it's newer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The weekly publish (below) can run ahead of the repo while its
          # pull request waits to be merged - start from whichever is newer
          # so nothing published is ever dropped.
          if gh release download citations-data --pattern "liahona_citations.json.gz" --dir /tmp/published 2>/dev/null; then
            gunzip -f /tmp/published/liahona_citations.json.gz
            newer="$(python3 -c "import sys; sys.path.insert(0, 'src'); from scriptures.citation_files import harvested_date as h; from pathlib import Path; print(h(Path('/tmp/published/liahona_citations.json')) > h(Path('data/liahona_citations.json')))")"
            if [[ "$newer" == "True" ]]; then
              cp /tmp/published/liahona_citations.json data/liahona_citations.json
              echo "Starting from the published copy"
            fi
          fi
          cp data/liahona_citations.json /tmp/baseline.json

      - name: Re-harvest citation metadata
        run: python3 scripts/harvest_liahona_citations.py

      - name: Check and publish for the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Refuses (and fails this run) if the harvest lost entries.
          python3 scripts/publish_citations.py liahona_citations.json --baseline /tmp/baseline.json --out dist
          gh release view citations-data >/dev/null 2>&1 || gh release create citations-data \
            --prerelease --title "Citation data (updated weekly)" \
            --notes "General Conference and Liahona citation lists, refreshed weekly by the refresh-*-citations workflows and downloaded by the app (src/scriptures/content_updates.py). Not an app release." \
            || gh release view citations-data >/dev/null  # created meanwhile by the other refresh
          gh release upload citations-data dist/liahona_citations.json.gz dist/liahona_citations.json.gz.sha256 --clobber

      # Opens a PR only if the harvest actually produced a different
      # data/liahona_citations.json (create-pull-request no-ops
      # otherwise) - a human still reviews and merges it, same as any
      # other change; this just removes the need to remember to run the
      # harvester by hand.
      - name: Open a PR if the citation data changed
        uses: peter-evans/create-pull-request@v8
        with:
          # Only the citation file - the harvester opens data/scriptures.db
          # to check references, which writes device settings into it.
          add-paths: data/liahona_citations.json
          commit-message: "Refresh Liahona citation metadata"
          title: "Refresh Liahona citation metadata"
          body: |
            Automated re-harvest of `data/liahona_citations.json` from
            churchofjesuschrist.org's Ensign/Liahona archive (see
            `scripts/harvest_liahona_citations.py`) - metadata only
            (article title, author, date, URL), never article text.
            Citations are detected via each article's own hyperlinks to
            `/study/scriptures/...`, never by reading article prose.

            Review the diff, then merge to bundle it in the next release. The app already has it: this run published it to the `citations-data` release, which the app checks daily.
          branch: automated/refresh-liahona-citations
          delete-branch: true
